<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1200" fill="url(#grad)"/>

  <!-- Accents -->
  
        <g stroke="#e2e2e2" stroke-width="1" opacity="0.8">
            <line x1="0" y1="300" x2="1000" y2="300" />
            <line x1="0" y1="600" x2="1000" y2="600" />
            <line x1="0" y1="900" x2="1000" y2="900" />
            <line x1="250" y1="0" x2="250" y2="1200" />
            <line x1="500" y1="0" x2="500" y2="1200" />
            <line x1="750" y1="0" x2="750" y2="1200" />
        </g>
        <circle cx="500" cy="600" r="333" stroke="#cccccc" stroke-width="1" fill="none" opacity="0.5"/>
        <circle cx="500" cy="600" r="200" stroke="#bbbbbb" stroke-dasharray="4 4" stroke-width="1" fill="none" opacity="0.6"/>
        

  <!-- Overlay -->
  <rect width="1000" height="1200" fill="url(#overlay)"/>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="start">
    <text x="60" y="1080" fill="#666666" font-size="14" font-weight="600" letter-spacing="4" text-transform="uppercase">WE TURN ATTENTION INTO OPPORTUNITY</text>
    <text x="60" y="1130" fill="#000000" font-size="32" font-weight="700" letter-spacing="1">DIGITAL GROWTH</text>
  </g>

  <!-- Corner Tag -->
  <g transform="translate(920, 60)" font-family="sans-serif" text-anchor="end">
    <text x="0" y="0" fill="#888888" font-size="12" letter-spacing="2">SYNTH // 2026</text>
  </g>
</svg>