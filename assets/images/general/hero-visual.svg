<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#grad)"/>

  <!-- Accents -->
  
        <g stroke="#e2e2e2" stroke-width="1" opacity="0.8">
            <line x1="0" y1="225" x2="1600" y2="225" />
            <line x1="0" y1="450" x2="1600" y2="450" />
            <line x1="0" y1="675" x2="1600" y2="675" />
            <line x1="400" y1="0" x2="400" y2="900" />
            <line x1="800" y1="0" x2="800" y2="900" />
            <line x1="1200" y1="0" x2="1200" y2="900" />
        </g>
        <circle cx="800" cy="450" r="300" stroke="#cccccc" stroke-width="1" fill="none" opacity="0.5"/>
        <circle cx="800" cy="450" r="180" stroke="#bbbbbb" stroke-dasharray="4 4" stroke-width="1" fill="none" opacity="0.6"/>
        

  <!-- Overlay -->
  <rect width="1600" height="900" fill="url(#overlay)"/>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="start">
    <text x="60" y="780" fill="#666666" font-size="14" font-weight="600" letter-spacing="4" text-transform="uppercase">CREATIVE × DIGITAL × TECHNOLOGY</text>
    <text x="60" y="830" fill="#000000" font-size="32" font-weight="700" letter-spacing="1">SYNTH MEDIA AGENCY</text>
  </g>

  <!-- Corner Tag -->
  <g transform="translate(1520, 60)" font-family="sans-serif" text-anchor="end">
    <text x="0" y="0" fill="#888888" font-size="12" letter-spacing="2">SYNTH // 2026</text>
  </g>
</svg>