<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#grad)"/>

  <!-- Accents -->
  
        <g opacity="0.6">
            <rect x="0" y="0" width="1200" height="800" fill="url(#grad)"/>
            <line x1="100" y1="100" x2="1100" y2="700" stroke="#d0d0d0" stroke-width="1"/>
            <text x="1080" y="140" fill="#aaaaaa" font-family="sans-serif" font-size="64" font-weight="900" text-anchor="end">01</text>
        </g>
        

  <!-- Overlay -->
  <rect width="1200" height="800" fill="url(#overlay)"/>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="start">
    <text x="60" y="680" fill="#666666" font-size="14" font-weight="600" letter-spacing="4" text-transform="uppercase">Category: Branding</text>
    <text x="60" y="730" fill="#000000" font-size="32" font-weight="700" letter-spacing="1">09 — BRAND DIRECTION</text>
  </g>

  <!-- Corner Tag -->
  <g transform="translate(1120, 60)" font-family="sans-serif" text-anchor="end">
    <text x="0" y="0" fill="#888888" font-size="12" letter-spacing="2">SYNTH // 2026</text>
  </g>
</svg>