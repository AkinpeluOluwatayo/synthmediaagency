<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#grad)"/>

  <!-- Accents -->
  
        <g stroke="#e2e2e2" stroke-width="1" opacity="0.8">
            <line x1="0" y1="200" x2="1200" y2="200" />
            <line x1="0" y1="400" x2="1200" y2="400" />
            <line x1="0" y1="600" x2="1200" y2="600" />
            <line x1="300" y1="0" x2="300" y2="800" />
            <line x1="600" y1="0" x2="600" y2="800" />
            <line x1="900" y1="0" x2="900" y2="800" />
        </g>
        <circle cx="600" cy="400" r="266" stroke="#cccccc" stroke-width="1" fill="none" opacity="0.5"/>
        <circle cx="600" cy="400" r="160" stroke="#bbbbbb" stroke-dasharray="4 4" stroke-width="1" fill="none" opacity="0.6"/>
        

  <!-- Overlay -->
  <rect width="1200" height="800" fill="url(#overlay)"/>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="start">
    <text x="60" y="680" fill="#666666" font-size="14" font-weight="600" letter-spacing="4" text-transform="uppercase">Category: Campaigns</text>
    <text x="60" y="730" fill="#000000" font-size="32" font-weight="700" letter-spacing="1">04 — CAMPAIGN VISUALS</text>
  </g>

  <!-- Corner Tag -->
  <g transform="translate(1120, 60)" font-family="sans-serif" text-anchor="end">
    <text x="0" y="0" fill="#888888" font-size="12" letter-spacing="2">SYNTH // 2026</text>
  </g>
</svg>