<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg4)"/>
  
  <!-- Industrial Construction Visual -->
  <g transform="translate(600, 400)">
    <polygon points="0,-200 -250,150 250,150" fill="none" stroke="url(#accent4)" stroke-width="8"/>
    <polygon points="0,-140 -180,120 180,120" fill="#22c55e" opacity="0.15"/>
    <text x="0" y="50" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="36" font-weight="900" text-anchor="middle">AMPLIFY CEMENT</text>
    <text x="0" y="90" fill="#84cc16" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="4">BUILDERS CLUB</text>
  </g>

  <!-- Tag -->
  <rect x="60" y="60" width="160" height="36" rx="18" fill="#22c55e" opacity="0.3"/>
  <text x="140" y="83" fill="#84cc16" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">CAMPAIGNS</text>
</svg>