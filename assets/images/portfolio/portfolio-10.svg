<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#grad)"/>

  <!-- Accents -->
  
        <g stroke="#d0d0d0" stroke-width="1" fill="none">
            <rect x="80" y="80" width="1040" height="640" stroke="#cccccc" stroke-width="1"/>
            <path d="M 120 160 L 220 160 M 120 200 L 320 200 M 120 240 L 260 240 M 120 280 L 400 280" stroke="#888888" stroke-width="2"/>
            <rect x="900" y="140" width="180" height="220" stroke="#bbbbbb" stroke-width="1" fill="#f0f0f0"/>
            <circle cx="990" cy="250" r="40" stroke="#000000" stroke-width="1" opacity="0.8"/>
        </g>
        

  <!-- Overlay -->
  <rect width="1200" height="800" fill="url(#overlay)"/>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="start">
    <text x="60" y="680" fill="#666666" font-size="14" font-weight="600" letter-spacing="4" text-transform="uppercase">Category: Web Development</text>
    <text x="60" y="730" fill="#000000" font-size="32" font-weight="700" letter-spacing="1">10 — DIGITAL EXPERIENCE</text>
  </g>

  <!-- Corner Tag -->
  <g transform="translate(1120, 60)" font-family="sans-serif" text-anchor="end">
    <text x="0" y="0" fill="#888888" font-size="12" letter-spacing="2">SYNTH // 2026</text>
  </g>
</svg>