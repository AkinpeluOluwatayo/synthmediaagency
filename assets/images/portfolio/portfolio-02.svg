<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e8c"/>
      <stop offset="100%" stop-color="#7b2fbe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>
  
  <!-- POS & Terminal Graphic -->
  <g transform="translate(600, 400)">
    <circle cx="0" cy="0" r="220" fill="url(#accent2)" opacity="0.25"/>
    
    <!-- POS Device -->
    <rect x="-120" y="-160" width="240" height="320" rx="28" fill="#18181b" stroke="#3f3f46" stroke-width="4"/>
    <rect x="-100" y="-140" width="200" height="150" rx="12" fill="#09090b"/>
    
    <!-- Screen Display -->
    <text x="0" y="-80" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="800" text-anchor="middle">PAYRIVER</text>
    <text x="0" y="-45" fill="#e91e8c" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">TAP TO PAY</text>
    
    <!-- Keypad -->
    <rect x="-90" y="30" width="50" height="30" rx="6" fill="#27272a"/>
    <rect x="-25" y="30" width="50" height="30" rx="6" fill="#27272a"/>
    <rect x="40" y="30" width="50" height="30" rx="6" fill="#27272a"/>
    
    <rect x="-90" y="70" width="50" height="30" rx="6" fill="#27272a"/>
    <rect x="-25" y="70" width="50" height="30" rx="6" fill="#27272a"/>
    <rect x="40" y="70" width="50" height="30" rx="6" fill="#27272a"/>
    
    <rect x="-90" y="110" width="50" height="30" rx="6" fill="#27272a"/>
    <rect x="-25" y="110" width="50" height="30" rx="6" fill="#27272a"/>
    <rect x="40" y="110" width="50" height="30" rx="6" fill="#22c55e"/>
  </g>

  <!-- Tag -->
  <rect x="60" y="60" width="160" height="36" rx="18" fill="#e91e8c" opacity="0.2"/>
  <text x="140" y="83" fill="#e91e8c" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">FINTECH</text>
</svg>