<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Abstract Phone / Banking Interface Visual -->
  <g transform="translate(600, 400)">
    <!-- Glowing background circles -->
    <circle cx="0" cy="0" r="280" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4" stroke-dasharray="10 15"/>
    
    <!-- Phone Mockup Frame -->
    <rect x="-140" y="-220" width="280" height="440" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="-125" y="-205" width="250" height="410" rx="24" fill="#090d16"/>
    
    <!-- Header UI -->
    <rect x="-105" y="-170" width="120" height="12" rx="6" fill="#334155"/>
    <circle cx="95" cy="-164" r="12" fill="#10b981" opacity="0.8"/>
    
    <!-- Balance Card -->
    <rect x="-105" y="-130" width="210" height="110" rx="16" fill="url(#accent)"/>
    <rect x="-85" y="-105" width="80" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <text x="-85" y="-65" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="800">₦4,850,000</text>
    <rect x="-85" y="-45" width="110" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
    
    <!-- Action Icons -->
    <circle cx="-75" cy="20" r="18" fill="#1e293b"/>
    <circle cx="-25" cy="20" r="18" fill="#1e293b"/>
    <circle cx="25" cy="20" r="18" fill="#1e293b"/>
    <circle cx="75" cy="20" r="18" fill="#1e293b"/>
    
    <!-- Transaction Rows -->
    <rect x="-105" y="60" width="210" height="35" rx="10" fill="#1e293b"/>
    <rect x="-105" y="105" width="210" height="35" rx="10" fill="#1e293b"/>
    <rect x="-105" y="150" width="210" height="35" rx="10" fill="#1e293b"/>
  </g>

  <!-- Tag -->
  <rect x="60" y="60" width="160" height="36" rx="18" fill="#10b981" opacity="0.2"/>
  <text x="140" y="83" fill="#10b981" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">BRANDING</text>
</svg>