<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg3)"/>
  
  <!-- Billboard Artwork Visual -->
  <g transform="translate(600, 400)">
    <rect x="-350" y="-180" width="700" height="340" rx="16" fill="#1c1917" stroke="#f59e0b" stroke-width="6"/>
    <rect x="-330" y="-160" width="660" height="300" rx="8" fill="url(#accent3)"/>
    
    <!-- Stage / Billboard Lighting -->
    <text x="0" y="-40" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="4">KROWN BREWS</text>
    <text x="0" y="30" fill="#fef08a" font-family="Inter, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="6">UNLEASH THE VIBE</text>
    
    <circle cx="-200" cy="0" r="40" fill="#ffffff" opacity="0.2"/>
    <circle cx="200" cy="0" r="40" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Tag -->
  <rect x="60" y="60" width="180" height="36" rx="18" fill="#f59e0b" opacity="0.3"/>
  <text x="150" y="83" fill="#fef08a" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">ADVERTISING</text>
</svg>